[bar/mybar]
width = 98%
height = 32pt
offset-x = 1%
offset-y = 5pt
bottom = false
background = #282a36
foreground = #f8f8f2
radius = 10
padding-left = 2
padding-right = 2
module-margin = 0
separator = " | "
separator-foreground = #6272a4
override-redirect = true
wm-restack = i3
fixed-center = true
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=14;3
modules-left = bluetooth keyboard i3 cava player
modules-center = date
modules-right = pulseaudio memory cpu temperature wlan battery

[module/i3]
type = internal/i3
pin-workspaces = true
label-focused = " %index% "
label-focused-background = #6272a4
label-focused-foreground = #f8f8f2
label-unfocused = " %index% "
label-unfocused-foreground = #6272a4
label-urgent = " %index% "
label-urgent-background = #ff5555

[module/date]
type = internal/date
interval = 5
date = "%a %d/%m/%Y %H:%M"
label-foreground = #8be9fd

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
label-volume = "Vol %percentage%%"
label-volume-foreground = #8be9fd
label-muted = "Muted"
label-muted-foreground = #ff5555

[module/memory]
type = internal/memory
interval = 2
label = "RAM %used%"
label-foreground = #50fa7b
warn-percentage = 80
label-warn = "RAM %used%"
label-warn-foreground = #ff5555

[module/cpu]
type = internal/cpu
interval = 2
label = "CPU %percentage%%"
label-foreground = #f1fa8c
warn-percentage = 80
label-warn = "CPU %percentage%%"
label-warn-foreground = #ff5555

[module/wlan]
type = custom/script
exec = echo "$(iwgetid -r 2>/dev/null || echo 'down') $(ip -4 addr show wlo1 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')"
interval = 5
label = "Wi-Fi %output%"
label-foreground = #50fa7b
click-left = ~/.config/rofi/wifi-menu.sh

[module/battery]
type = internal/battery
battery = BAT0
adapter = ACAD
poll-interval = 5
format-charging = <label-charging>
format-discharging = <label-discharging> <bar-capacity>
format-full = <label-full>
label-charging = "CHR %percentage%%"
label-charging-foreground = #50fa7b
label-discharging = "BAT %percentage%%"
label-discharging-foreground = #f8f8f2
label-full = "FULL 100%"
label-full-foreground = #50fa7b
low-at = 20
format-low = <label-low> <bar-capacity>
label-low = "LOW %percentage%%"
label-low-foreground = #ff5555
bar-capacity-width = 10
bar-capacity-indicator = |
bar-capacity-fill = ━
bar-capacity-fill-foreground = #50fa7b
bar-capacity-empty = ━
bar-capacity-empty-foreground = #44475a

[module/player]
type = custom/script
exec = playerctl metadata --format "{{ artist }} - {{ title }}" 2>/dev/null || echo ""
interval = 3
label-foreground = #50fa7b
click-left = playerctl play-pause
click-right = playerctl next
scroll-up = playerctl volume 0.05+
scroll-down = playerctl volume 0.05-
label-maxlen = 68
label-ellipsis = true

[module/cava]
type = custom/script
exec = ~/.config/polybar/cava-polybar.sh
tail = true
label-foreground = #ff79c6

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
label = "%temperature-c%"
label-foreground = #ffb86c
warn-temperature = 80
label-warn = "%temperature-c%"
label-warn-foreground = #ff5555

[module/bluetooth]
type = custom/script
exec = bluetoothctl show | grep -q "Powered: yes" && echo "%{T2}%{F#6272a4}%{F-}%{T-}" || echo "%{T2}%{F#44475a}%{F-}%{T-}"
interval = 5
click-left = blueman-manager

[module/keyboard]
type = custom/script
exec = xset -q | grep -q "LED mask:  00001000" && echo "br" || echo "us"
interval = 1
label = "%output%"
label-foreground = #ff79c6
click-left = xdotool key alt+shift
